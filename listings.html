<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NAGA ROOM — 長崎の掲載物件を一覧から。条件で絞り込み、気になるお部屋を見比べられます。">
  <title>掲載物件一覧 | NAGA ROOM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/nagaroom-shared.css">
</head>
<body class="has-nr-header page-listing">
  <header class="nr-header">
    <div class="nr-header-inner">
      <a href="index.html" class="nr-brand nr-brand--wordmark">
        <img
          src="img/nr-logo-wordmark.png"
          alt="NAGA ROOM ナガルーム"
          class="nr-brand-wordmark-img"
          width="200"
          height="44"
          decoding="async"
        />
      </a>
      <nav class="nr-nav" aria-label="主要ナビ">
        <a href="rental.html">会話で探す</a>
        <a href="listings.html" aria-current="page">一覧で見る</a>
      </nav>
    </div>
  </header>

  <main class="listing-main">
    <header class="listing-hero">
      <h1>物件一覧</h1>
      <p class="listing-hero-lead">長崎エリアの掲載物件。余白を広く、必要な情報だけを表示しています。</p>
    </header>

    <section class="listing-chat-banner" aria-label="会話で探す案内">
      <p>条件がまだ決まっていない方は、<strong>AIチャット</strong>で整理できます。</p>
      <a class="btn-to-chat btn-primary" href="rental.html" style="font-size:0.8rem;padding:0.65rem 1.2rem;">会話で探す</a>
    </section>

    <section class="filter-panel" aria-label="条件で絞り込み">
      <p class="filter-panel-title">条件で絞り込み</p>
      <div class="filter-grid">
        <div class="filter-field">
          <label for="f-area">エリア</label>
          <select id="f-area">
            <option value="all">すべて</option>
            <option value="nagasaki">長崎市</option>
            <option value="isahaya">諫早市</option>
            <option value="omura">大村市</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="f-rent">家賃の目安</label>
          <select id="f-rent">
            <option value="all">すべて</option>
            <option value="to55">〜5.5万円くらい</option>
            <option value="to70">〜7万円くらい</option>
            <option value="over70">7万円より上</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="f-layout">間取り</label>
          <select id="f-layout">
            <option value="all">すべて</option>
            <option value="compact">1R・1K</option>
            <option value="mid">1DK</option>
            <option value="wide">1LDK〜</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="f-feature">こだわり</label>
          <select id="f-feature">
            <option value="all">指定なし</option>
            <option value="station">駅・生活導線を重視</option>
            <option value="pet">ペット相談可の例</option>
            <option value="new">築浅・内装きれいめ</option>
          </select>
        </div>
      </div>
      <p class="filter-count" id="filterCount" aria-live="polite"></p>
    </section>

    <div class="listing-grid" id="listingGrid"></div>

    <section class="footer-cta-section listing-line-cta-block" aria-label="LINEでスタッフに相談">
      <div class="footer-cta-inner footer-cta-inner--line">
        <div class="line-cta-buttons line-cta-buttons--single">
          <a
            href="#"
            id="listingFooterLineBtn"
            class="cta-btn cta-btn-line"
            target="_blank"
            rel="noopener noreferrer"
          >LINEでスタッフに直接相談する ＞</a>
        </div>
        <div class="line-guide-box line-guide-box--emphasis">
          <p class="line-guide-head">ご利用の流れ</p>
          <p class="line-guide-main">
            ボタンを押すとLINEの入力欄に<br>
            「<span class="line-guide-accent">相談</span>」というメッセージが<br>
            <strong>自動で入ります</strong>
          </p>
          <p class="line-guide-strong">
            そのまま「<span class="line-guide-accent">相談</span>」の文字を<br>
            <strong class="line-guide-highlight line-guide-keep">一度だけ送信</strong>していただくと<br>
            <strong class="line-guide-highlight line-guide-keep">専用のご案内</strong>がスタートします
          </p>
        </div>
      </div>
    </section>

    <nav class="listing-back-chat" aria-label="会話でお部屋を探す">
      <a href="rental.html" class="listing-back-chat-btn">
        <span class="listing-back-chat-badge" aria-hidden="true">会話</span>
        <span class="listing-back-chat-body">
          <span class="listing-back-chat-title">条件を話して、すぐ提案</span>
          <span class="listing-back-chat-desc">チャットで整理</span>
        </span>
        <span class="listing-back-chat-action" aria-hidden="true">はじめる</span>
      </a>
    </nav>
  </main>

  <footer class="nr-page-footer">
    <a href="index.html">サービスTOP</a>
    <a href="rental.html">会話で探す</a>
    <a href="listings.html">一覧で見る</a>
  </footer>

  <script src="js/nagaroom-data.js"></script>
  <script src="js/nr-favorites.js"></script>
  <script src="js/properties-source.js"></script>
  <script>
  (function () {
    'use strict';

    var NR = window.NAGA_ROOM || { PROPERTIES: [], LINE_URL: '#', PROPERTIES_DATA_URL: 'data/properties.json' };
    var LINE_URL =
      typeof NR.lineMessageUrl === 'function'
        ? NR.lineMessageUrl('相談')
        : NR.LINE_URL || '#';
    var allProps = [];
    var PROPERTIES_DATA_URL = NR.PROPERTIES_DATA_URL || 'data/properties.json';

    document.getElementById('listingFooterLineBtn').href = LINE_URL;

    var elGrid = document.getElementById('listingGrid');
    var elCount = document.getElementById('filterCount');
    var fArea = document.getElementById('f-area');
    var fRent = document.getElementById('f-rent');
    var fLayout = document.getElementById('f-layout');
    var fFeature = document.getElementById('f-feature');

    function escapeHtml(s) {
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function rentOk(p, rentVal) {
      if (rentVal === 'all') return true;
      var r = p.rentMan;
      if (rentVal === 'to55') return r <= 5.5;
      if (rentVal === 'to70') return r <= 7;
      if (rentVal === 'over70') return r > 7;
      return true;
    }

    function featureOk(p, feat) {
      if (feat === 'all') return true;
      var f = p.features || [];
      return f.indexOf(feat) !== -1;
    }

    function filterList() {
      var a = fArea.value;
      var r = fRent.value;
      var l = fLayout.value;
      var feat = fFeature.value;
      return allProps.filter(function (p) {
        if (a !== 'all' && p.filterRegion !== a) return false;
        if (!rentOk(p, r)) return false;
        if (l !== 'all' && p.layoutGroup !== l) return false;
        if (!featureOk(p, feat)) return false;
        return true;
      });
    }

    function render() {
      var list = filterList();
      elCount.textContent = list.length + '件が条件に合います';
      elGrid.innerHTML = '';
      if (list.length === 0) {
        elGrid.innerHTML = '<p class="listing-empty">条件に合う物件がありません。条件を変えるか、<a href="rental.html">会話で探す</a>もご利用ください。</p>';
        return;
      }
      list.forEach(function (p) {
        var article = document.createElement('article');
        article.className = 'property-card property-card--listing';
        article.setAttribute('data-property-id', p.id);
        var detailUrl = p.detailUrl || ('property.html?id=' + encodeURIComponent(p.id));
        if (window.NR_FAVORITES && NR_FAVORITES.listingCardHtml) {
          article.innerHTML = NR_FAVORITES.listingCardHtml(p, escapeHtml, detailUrl);
        }
        elGrid.appendChild(article);
      });
      if (window.NR_FAVORITES && NR_FAVORITES.wireListingCards) {
        NR_FAVORITES.wireListingCards(elGrid);
      }
    }

    [fArea, fRent, fLayout, fFeature].forEach(function (el) {
      el.addEventListener('change', render);
    });
    function enrichListingRow(p) {
      if (!p || typeof p !== 'object') return p;
      var city = p.city || '';
      var region = p.filterRegion;
      if (!region) {
        if (/諫早/.test(city)) region = 'isahaya';
        else if (/大村/.test(city)) region = 'omura';
        else region = 'nagasaki';
      }
      var layout = String(p.layout || '').toUpperCase();
      var layoutGroup = p.layoutGroup;
      if (!layoutGroup) {
        if (/1R|1K/.test(layout)) layoutGroup = 'compact';
        else if (/LDK|2K|3K/.test(layout)) layoutGroup = 'wide';
        else layoutGroup = 'mid';
      }
      var rentMan = p.rentMan;
      if (rentMan == null && p.rentYen != null) {
        rentMan = Math.round((Number(p.rentYen) / 10000) * 10) / 10;
      }
      var features = p.features;
      if (!features || !features.length) {
        features = [];
        if (/駅/.test(String(p.station || ''))) features.push('station');
        if (p.petAllowed || p.pet_ok) features.push('pet');
        if (/新築|築浅/.test(String(p.buildingAge || '') + String(p.builtYear || '') + String(p.story || ''))) features.push('new');
        if (p.internetFree) features.push('internet');
        if (p.autoLock) features.push('security');
        if (p.deliveryBox) features.push('delivery_box');
      }
      p.filterRegion = region;
      p.layoutGroup = layoutGroup;
      p.rentMan = rentMan;
      p.features = features;
      if (!p.comment && p.story) p.comment = p.story;
      if (!p.detailUrl && p.id) {
        p.detailUrl = 'property.html?id=' + encodeURIComponent(p.id);
      }
      if (!p.image) {
        if (Array.isArray(p.images) && p.images.length) p.image = p.images[0];
        else if (p.image1) p.image = p.image1;
        else {
          p.image =
            'https://images.unsplash.com/photo-1560185007-cde436f6a4d0?w=640&q=80';
        }
      }
      return p;
    }

    function loadPropertyList() {
      var loader = window.NR_PROPERTY_LOADER;
      if (loader && typeof loader.loadPropertyListWithFallback === 'function') {
        return loader.loadPropertyListWithFallback(NR).then(function (r) {
          return (r.list || []).map(enrichListingRow);
        });
      }
      return fetch(PROPERTIES_DATA_URL, { cache: 'no-store' })
        .then(function (res) {
          if (!res.ok) throw new Error('Failed to load properties.json');
          return res.json();
        })
        .then(function (data) {
          return (Array.isArray(data) ? data : []).map(enrichListingRow);
        })
        .catch(function (err) {
          console.error('[listings] properties load error:', err);
          return (Array.isArray(NR.PROPERTIES) ? NR.PROPERTIES : []).map(enrichListingRow);
        });
    }

    loadPropertyList().then(function (list) {
      allProps = list;
      render();
    });
  })();
  </script>
</body>
</html>
